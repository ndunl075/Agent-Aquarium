appId: org.agentaquarium.desktop
productName: Agent Aquarium
directories:
  output: release
files:
  - apps/desktop/dist/**
  - package.json
  - LICENSE
  - '!**/*.map'
asar: true
asarUnpack:
  - '**/better-sqlite3/**'
npmRebuild: true
protocols:
  - name: Agent Aquarium
    schemes:
      - agent-aquarium
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  category: Development

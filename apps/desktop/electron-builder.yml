appId: org.agentaquarium.desktop
productName: Agent Aquarium
directories:
  output: release
files:
  - apps/desktop/dist/**
  - '!apps/desktop/dist/cli/**'
  - '!apps/desktop/dist/cli.cjs'
  - package.json
  - LICENSE
  - docs/THIRD_PARTY_NOTICES.md
  - '!**/*.map'
asar: true
extraResources:
  - from: apps/desktop/dist/cli
    to: cli
asarUnpack:
  - '**/better-sqlite3/**'
npmRebuild: true
protocols:
  - name: Agent Aquarium
    schemes:
      - agent-aquarium
win:
  icon: assets/aquarium.ico
  target:
    - nsis
    - portable
  signExecutable: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
mac:
  icon: assets/aquarium.png
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
linux:
  icon: assets/aquarium.png
  target:
    - AppImage
    - deb
  category: Development
